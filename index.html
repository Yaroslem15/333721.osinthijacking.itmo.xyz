<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ITMO</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #0d1117;
      color: #e6edf3;
    }
    .card {
      text-align: center;
      padding: 40px 60px;
      border: 1px solid #30363d;
      border-radius: 12px;
      background: #161b22;
    }
    h1 {
      font-size: 1.4rem;
      margin-bottom: 8px;
      color: #58a6ff;
    }
    p {
      font-size: 2rem;
      margin: 4px 0;
      font-weight: 600;
    }
    .label {
      font-size: 0.9rem;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>FBIT</h1>
    <div class="label">Фамилия</div>
    <p id="surname">Лемешев</p>
    <div class="label">ID</div>
    <p id="student-id">333721</p>
  </div>
</body>
</html>
